name: superdex-scenarios

services:
  superdex:
    image: relaripublic.azurecr.io/superdex/scenarios-dev:1.0.0
    # SuperDex publishes Linux x86-64 binaries but no Linux ARM64 binaries.
    # Docker Desktop emulates this image on Apple Silicon Macs.
    platform: linux/amd64
    init: true
    volumes:
      # Execute the candidate's checkout instead of the copy baked into the
      # image, so Python edits are picked up without rebuilding.
      - .:/opt/scenarios
